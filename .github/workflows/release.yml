name: Build & Release

on:
  push:
    tags:
      - 'v*'   # push tag like v1.2.0
  workflow_dispatch:
    inputs:
      snapshot_build:
        description: 'Make snapshot release'
        required: true
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Derive version from tag or generate SNAPSHOT
        id: vars
        shell: bash
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            # Manual trigger - generate SNAPSHOT version
            TIMESTAMP=$(date -u +"%Y%m%d-%H%M%S")
            VER="SNAPSHOT-${TIMESTAMP}"
            TAG="snapshot-${TIMESTAMP}"
            echo "is_snapshot=true" >> $GITHUB_OUTPUT
          else
            # Tag push - use tag version
            TAG="${GITHUB_REF_NAME}"     # e.g. v1.2.0
            VER="${TAG#v}"               # strip 'v'
            echo "is_snapshot=false" >> $GITHUB_OUTPUT
          fi
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "ver=${VER}" >> $GITHUB_OUTPUT
          echo "Building version: ${VER}"

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Run unit tests
        env:
          RELEASE_VERSION: ${{ steps.vars.outputs.ver }}
        run: ./gradlew --no-daemon test -PreleaseVersion=${{ steps.vars.outputs.ver }} --stacktrace

      - name: Upload JUnit XML results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-xml
          path: |
            **/build/test-results/test/*.xml

      - name: Upload HTML test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-html
          path: |
            **/build/reports/tests/test/**

      - name: Build all modules with release version
        env:
          RELEASE_VERSION: ${{ steps.vars.outputs.ver }}
        run: ./gradlew --no-daemon clean build -x test -PreleaseVersion=${{ steps.vars.outputs.ver }} --stacktrace

      - name: List plugin build outputs
        run: ls -la plugin/build/libs || true

      - name: Collect artifacts
        run: |
          mkdir -p dist
          # Plugin shaded jar (LogDO2-<ver>.jar)
          cp plugin/build/libs/LogDO2-*.jar dist/
          # API plain jar (logdo2-api-<ver>.jar)
          cp logdo2-api/build/libs/logdo2-api-*.jar dist/
          # LogDO2 Core logic package
          cp core/build/libs/core-*.jar dist/
          ls -la dist

      - name: Publish all modules to unified Maven staging
        env:
          RELEASE_VERSION: ${{ steps.vars.outputs.ver }}
        run: |
          # Create unified staging directory
          mkdir -p maven-repo
          # Publish API module
          ./gradlew --no-daemon :logdo2-api:publishMavenJavaPublicationToLocalGhPagesRepository -PreleaseVersion=${{ steps.vars.outputs.ver }} --stacktrace
          # Publish core module
          ./gradlew --no-daemon :core:publishMavenJavaPublicationToLocalGhPagesRepository -PreleaseVersion=${{ steps.vars.outputs.ver }} --stacktrace
          # Merge both staging directories into one
          cp -r logdo2-api/build/repo-staging/* maven-repo/
          cp -r core/build/repo-staging/* maven-repo/
          # List merged contents
          echo "=== Maven repo contents ==="
          find maven-repo -type f

      - name: Deploy to external Maven repo (main:/maven)
        uses: peaceiris/actions-gh-pages@v4
        with:
          personal_token: ${{ secrets.MAVEN_REPO_TOKEN }}
          external_repository: Pinecraft-Project/maven-repo
          publish_branch: main
          publish_dir: maven-repo
          enable_jekyll: true
          exclude_assets: .nojekyll
          destination_dir: maven
          keep_files: true
          commit_message: "Publish Maven artifacts ${{ steps.vars.outputs.ver }} (logdo2-api + core) to main:/maven from LogDO2"

      - name: Create GitHub Release
        if: steps.vars.outputs.is_snapshot == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.tag }}
          name: ${{ steps.vars.outputs.tag }}
          generate_release_notes: true
          files: |
            dist/**