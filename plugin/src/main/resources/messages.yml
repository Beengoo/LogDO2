# Placeholders: {name}, {uuid}, {ip}, {code}, {url}, {duration}, {remaining}

prelogin:
  banned: "<red>You are banned. Remaining: {remaining}</red>"

login:
  first_join:
    dialog:
      title: "<#ffcc00>Authorize via Discord</#ffcc00>"
      body: "Please use your Discord account to link your Minecraft and Discord accounts on server."
      actions:
        authorize: "Authorize"
        close: "I want to take a look at the server"
    title: "<#ffcc00>Authorize via Discord</#ffcc00>"
    subtitle: "<gray>Click the chat link to link your account</gray>"
    click_text: "<yellow>[Click here to authorize]</yellow>"
    click_hover: "Open Discord authorization page"
  bedrock:
    # Bedrock connections are not supported MINI color formats in chat (but somehow support in on titles...)
    code_hint: "Go to our official discord server, find our bot, open dm and run /login {code} command."
  linked_actionbar: "<green>Welcome!</green>"
  conditions:
    denied_single: "<red>{reason}</red>"
    denied_multi: |
      <red>Login denied:</red>
      {reasons}

ip:
  unconfirmed:
    dialog:
      title: "<#ffcc00>Confirm your location!</#ffcc00>"
      body: "Your location (IP address) is changed!\nPlease check your Discord DM to confirm your new location."
      actions:
        bot_profile: "Open bot profile"
        close: "Close"
    title: "<red>IP not confirmed</red>"
    subtitle: "<gray>Check your Discord DM</gray>"
  confirm_actionbar: "<green>IP confirmed.</green>"
  reject_kick: "<red>Login rejected by account owner. Ban {duration}.</red>"

timeouts:
  login_kick: "<red>Login timed out. Please rejoin to try again.</red>"
  ip_kick: "<red>IP confirmation timed out. Please rejoin to request again.</red>"

chat:
  auth_link_text: "<green>[Click here to authorize]</green>"
  auth_link_hover: "Open Discord OAuth2"

discord:
  first_login_dm: "Your Minecraft account {name} ({uuid}) has been linked. Welcome!"
  ip_confirm_title: "New login detected"
  ip_confirm_title_confirmed: "✅ Login confirmed for {name} ({uuid})"
  ip_confirm_title_rejected: "❌ Login rejected for {name} ({uuid})"
  ip_confirm_body: "Someone tried to log into {name} ({uuid}) from IP {ip}. Confirm?"
  ip_confirm_button_accept: "Confirm"
  ip_confirm_button_reject: "Reject"
  finalize_oauth_link: "Finish linking: {url}"
  slash_login_ok: "✅ Linked. Check in-game and finish OAuth if prompted."
  slash_login_invalid: "❌ Invalid or expired code. Rejoin the server to get a new one."
  slash_login_missing_code: "Missing required option: code"
  slash_primary_no_accounts: "❌ You don't have any linked Minecraft accounts."
  slash_primary_only_one: "ℹ️ You only have one linked account, so it's already your primary account."
  slash_primary_placeholder: "Select your primary account"
  slash_primary_current: "Current primary account"
  slash_primary_make_primary: "Make this your primary account"
  slash_primary_choose: "Choose which Minecraft account should be your primary:"
  slash_primary_success: "✅ Primary account changed to {name}"
  slash_primary_invalid: "❌ Invalid account selection."
  slash_primary_error: "❌ An error occurred while changing your primary account."

admin:
  logout_kick: "<red>You have been logged out by an admin. Please rejoin to link again.</red>"
  force_relogin_kick: "<red>Re-authentication required. Please rejoin and complete Discord OAuth.</red>"

limits:
  simultaneous_kick: "<red>Another profile linked to your Discord is already online: {other}</red>"
